[package]
name = "music-xima"
version = "1.1.0"
description = "Offline personal music player"
authors = ["xima"]
edition = "2021"
rust-version = "1.82"

[lib]
# `staticlib`/`cdylib` are required by the Android (and iOS) targets.
name = "music_xima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# `protocol-asset` is required by app.security.assetProtocol in tauri.conf.json —
# the WebView loads cached cover art through asset://.
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-player = { path = "../tauri-plugin-player" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
async-trait = "0.1.92"
log = "0.4.33"

tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros", "time"] }

# SQLite is driven directly from the Rust core. The frontend never sees SQL,
# so `tauri-plugin-sql` (a frontend-facing bridge) would add no value here.
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "macros",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-log = "2.9.0"

[features]
# Used by `tauri build --debug` / devtools.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
